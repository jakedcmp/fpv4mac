name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install cmake pkgconf libusb libsodium
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Build WFB-NG bridge
        run: ./scripts/build-wfb-bridge.sh
      - name: Test WFB-NG authentication, FEC, and UDP output
        run: ctest --test-dir build-wfb-bridge --output-on-failure
